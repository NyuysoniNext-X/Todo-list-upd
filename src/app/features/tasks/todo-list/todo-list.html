<div class="todo-container">
  <h1>📝 NyuysoniNext-X Todo List</h1>

  <div class="add-section">
    <input
      type="text"
      [(ngModel)]="newTask"
      placeholder="What needs to be done?"
      (keyup.enter)="addTodo()"
      class="task-input" />
    <button (click)="addTodo()" class="add-btn">Add Task</button>
  </div>

  <div class="todo-list">
    @if (todos().length === 0) {
      <p class="empty-state">No tasks yet. Add one above! 👆</p>
    }

    @for (todo of todos(); track todo.id) {
      <div class="todo-item" [class.completed]="todo.completed">

        <span class="todo-text" (click)="toggleComplete(todo.id)">
          {{ todo.completed ? '✅' : '⬜' }} {{ todo.text }}
        </span>

        <button class="delete-btn" (click)="deleteTodo(todo.id)">🗑️</button>
      </div>
    }
  </div>
</div>
